name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # The same image docker-compose.yml uses. The integration tests create
    # their own civickit_test database on this server; DATABASE_URL is
    # deliberately left unset so nothing here can be mistaken for a dev database.
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: civickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # These are the only tests that execute SQL. The unit tests mock the
      # repositories, so without this a broken query typechecks, builds, and
      # passes CI.
      - name: Run integration tests
        run: npm run test:integration -- --run
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/civickit_test
